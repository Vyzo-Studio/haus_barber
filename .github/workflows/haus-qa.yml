name: Haus Barber QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haus-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in script.js admin.js config.js haus-public-dynamic.js haus-admin-extensions.js haus-combos.js haus-experience.js haus-i18n-data.js haus-legal.js haus-legal-data.js; do
            node --check "$f"
          done
          for f in tests/*.test.cjs; do
            node --check "$f"
          done
      - name: Run regression tests without production credentials
        run: |
          files=()
          for f in tests/*.test.cjs; do
            if [[ "$f" != "tests/haus-browser-smoke.test.cjs" && "$f" != "tests/haus-global-experience.browser.test.cjs" ]]; then
              files+=("$f")
            fi
          done
          node --test "${files[@]}"
      - name: Check sitemap, privacy and payment integrity contracts
        run: node --test tests/haus-omega-repair.test.cjs

# Do not put Supabase production keys or write-enabled database access in CI.

  browser-smoke:
    name: Real Chromium smoke — public and admin entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated local site and inspect viewports
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/haus-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node --test tests/haus-browser-smoke.test.cjs tests/haus-global-experience.browser.test.cjs
      - name: Keep public screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haus-chromium-public-smoke
          path: browser-artifacts/*.png
          retention-days: 7
          if-no-files-found: ignore
